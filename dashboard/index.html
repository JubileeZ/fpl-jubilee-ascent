<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FPL Jubilee Ascent - Ownership Explorer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
  <div class="app-container" data-view="explorer">
    <header class="navbar">
      <div class="brand">
        <span class="logo-icon">⚽</span>
        <div class="brand-text">
          <h1>FPL Jubilee Ascent</h1>
          <span class="subtitle">Ownership Explorer</span>
        </div>
      </div>

      <div class="header-controls">
        <div class="control-group">
          <label for="horizonStart">Horizon begins</label>
          <select id="horizonStart" class="select-input"></select>
        </div>
        <div class="control-group">
          <label for="horizonEnd">Horizon to</label>
          <select id="horizonEnd" class="select-input"></select>
        </div>
        <div class="control-group">
          <label for="primaryModelSelect">Primary Model:</label>
          <select id="primaryModelSelect" class="select-input">
            <option value="default">Champion Model</option>
          </select>
        </div>
        <div class="control-group">
          <button type="button" id="btn-refresh" class="btn btn-primary">Refresh</button>
        </div>
      </div>
    </header>
    <p id="refresh-status" class="explorer-meta"></p>

    <section class="explorer-root" id="explorer-root">
      <div class="card explorer-toolbar">
        <div class="group">
          <label class="title">Y-axis</label>
          <div class="checks">
            <label><input type="radio" name="y-metric" value="rate_per_90" checked> Projected Rate</label>
            <label><input type="radio" name="y-metric" value="per_gameweek"> xP per Gameweek</label>
            <label><input type="checkbox" id="explorer-assume-90"> Assume 90</label>
          </div>
        </div>
        <div class="group">
          <label class="title">Position</label>
          <div class="checks" id="explorer-pos-checks"></div>
        </div>
        <div class="group">
          <label class="title">Club</label>
          <div id="explorer-club" class="club-multi"></div>
        </div>
        <div class="group">
          <label class="title">Price</label>
          <div class="range-row">
            <input type="number" id="explorer-price-min" step="0.5">
            <span>–</span>
            <input type="number" id="explorer-price-max" step="0.5">
          </div>
        </div>
        <div class="group">
          <label class="title">Avg minutes floor</label>
          <div class="range-row">
            <input type="range" id="explorer-xmins-floor" min="0" max="90" step="1" value="45">
            <span id="explorer-xmins-floor-val">45</span>
          </div>
        </div>
        <div class="group">
          <label class="title">Search</label>
          <input type="search" id="explorer-search" placeholder="Player, club, role…" autocomplete="off" spellcheck="false">
        </div>
      </div>
      <p id="explorer-meta" class="explorer-meta"></p>
      <div class="explorer-charts">
        <div id="chart-ownership" class="explorer-chart"></div>
        <div id="chart-price" class="explorer-chart"></div>
      </div>
      <div class="card mix-panel">
        <p class="title">Mix vs Mix (same size, view-only)</p>
        <div class="mix-columns">
          <div class="mix-column" data-mix-side="a">
            <strong>Mix A</strong>
            <ul id="mix-a-list" class="mix-list"></ul>
          </div>
          <div class="mix-column" data-mix-side="b">
            <strong>Mix B</strong>
            <ul id="mix-b-list" class="mix-list"></ul>
          </div>
        </div>
        <p id="mix-reason" class="mix-reason"></p>
        <p id="mix-compare" class="mix-compare"></p>
      </div>
      <div id="explorer-table-wrap" class="explorer-table-wrap">
        <table class="data-table explorer-table">
          <thead>
            <tr id="explorer-thead-row">
              <th data-sort="rank">#</th>
              <th data-sort="name">Player</th>
              <th data-sort="club">Club</th>
              <th data-sort="pos">Pos</th>
              <th data-sort="price">Price</th>
              <th data-sort="own">Own%</th>
              <th data-sort="total">Total</th>
              <th data-sort="rate_per_90">/90</th>
              <th data-sort="avg_minutes">Avg mins</th>
              <th data-sort="role">Role</th>
              <th>Mix</th>
            </tr>
          </thead>
          <tbody id="explorer-table"></tbody>
        </table>
      </div>
    </section>
  </div>

  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  <script src="app.js?v=13"></script>
  <script src="explorer.js?v=10"></script>
</body>
</html>
