[project]
name = "fpl-jubilee-ascent"
version = "0.1.0"
description = "Fantasy Premier League score projection and MILP transfer optimization engine"
requires-python = ">=3.14"
dependencies = [
    "fuzzywuzzy>=0.18.0",
    "highspy>=1.15.0",
    "httpx>=0.28.1",
    "matplotlib>=3.10.0",
    "pandas>=3.0.4",
    "pyarrow>=24.0.0",
    "playwright>=1.61.0",
    "scipy>=1.15.0",
    "streamlit>=1.65,<2",
    "tabulate>=0.10.0",
    "tenacity>=9.1.4",
]

[dependency-groups]
dev = [
    "pyright>=1.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.20",
]

[tool.ruff.lint]
ignore = ["E402"]

[tool.pytest.ini_options]
pythonpath = ["."]
