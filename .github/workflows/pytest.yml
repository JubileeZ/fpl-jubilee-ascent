name: Python tests

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pytest-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pytest-standard:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pytest-setup
        timeout-minutes: 5
      - run: uv run --no-sync ruff check .
      - run: >-
          uv run --no-sync pytest -n 4 --dist worksteal --durations=20
          --ignore=tests/test_produce_validation_evidence.py
          --ignore=tests/test_verified_checkpoint_evidence.py

  pytest-validation-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pytest-setup
        timeout-minutes: 5
      - run: uv run --no-sync pytest -n 4 --dist worksteal --durations=20 tests/test_produce_validation_evidence.py

  pytest-checkpoint-verification:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/pytest-setup
        timeout-minutes: 5
      - run: uv run --no-sync pytest -n 4 --dist worksteal --durations=20 tests/test_verified_checkpoint_evidence.py

  full-pytest:
    needs: [pytest-standard, pytest-validation-replay, pytest-checkpoint-verification]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every pytest group to pass
        env:
          STANDARD_RESULT: ${{ needs.pytest-standard.result }}
          VALIDATION_REPLAY_RESULT: ${{ needs.pytest-validation-replay.result }}
          CHECKPOINT_VERIFICATION_RESULT: ${{ needs.pytest-checkpoint-verification.result }}
        run: |
          test "$STANDARD_RESULT" = success &&
          test "$VALIDATION_REPLAY_RESULT" = success &&
          test "$CHECKPOINT_VERIFICATION_RESULT" = success
