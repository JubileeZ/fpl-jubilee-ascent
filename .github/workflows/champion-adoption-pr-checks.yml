name: Champion adoption PR checks

on:
  pull_request:
    branches:
      - main
    paths:
      - "config/model_selection.json"
      - "config/model_selection.adoption.json"
  workflow_dispatch:
    inputs:
      request_id:
        description: "Adoption request identifier"
        required: true
      slate_id:
        description: "Frozen comparison slate identifier"
        required: true

permissions:
  contents: read

jobs:
  verify-adoption-pr:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || vars.CHAMPION_ADOPTION_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync frozen dependencies
        run: uv sync --frozen

      - name: Hydrate validation-evidence branch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/validation-evidence"
          git fetch origin validation-evidence || true
          if git show-ref --verify --quiet refs/remotes/origin/validation-evidence; then
            git archive --format=tar origin/validation-evidence | tar -x -C "$RUNNER_TEMP/validation-evidence"
          fi

      - name: Verify exact two-file adoption diff, immutable snapshot, and eligibility
        shell: bash
        env:
          INPUT_REQ_ID: ${{ github.event.inputs.request_id || '' }}
          INPUT_SLATE_ID: ${{ github.event.inputs.slate_id || '' }}
        run: |
          set -euo pipefail
          REQ_ID="$INPUT_REQ_ID"
          SLATE_ID="$INPUT_SLATE_ID"
          if [ -z "$REQ_ID" ] && [ -f config/model_selection.adoption.json ]; then
            REQ_ID=$(python3 -c "import json; print(json.load(open('config/model_selection.adoption.json'))['request_id'])")
            SLATE_ID=$(python3 -c "import json; print(json.load(open('config/model_selection.adoption.json'))['slate_id'])")
          fi
          git fetch origin main
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          ARGS=(verify-adoption-pr --evidence-root "$RUNNER_TEMP/validation-evidence" --request-id "$REQ_ID" --slate-id "$SLATE_ID")
          for f in "${CHANGED[@]}"; do
            ARGS+=(--changed-file "$f")
          done
          uv run python -m commands.manage_champion_adoption "${ARGS[@]}"
