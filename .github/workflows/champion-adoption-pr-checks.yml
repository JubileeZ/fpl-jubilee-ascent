name: Champion adoption PR checks

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      request_id:
        description: "Adoption request identifier"
        required: true
      slate_id:
        description: "Frozen comparison slate identifier"
        required: true

permissions:
  contents: read

jobs:
  verify-adoption-pr:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request' || vars.CHAMPION_ADOPTION_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out PR head
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Detect Champion selection diff
        id: diff-gate
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_adoption_pr=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch origin main
          if git diff --name-only origin/main...HEAD | grep -Eq '^config/model_selection(\.adoption)?\.json$'; then
            echo "is_adoption_pr=true" >> "$GITHUB_OUTPUT"
          else
            echo "No Champion selection files modified; non-adoption PR passes verify-adoption-pr."
            echo "is_adoption_pr=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install uv
        if: steps.diff-gate.outputs.is_adoption_pr == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync frozen dependencies
        if: steps.diff-gate.outputs.is_adoption_pr == 'true'
        run: uv sync --frozen

      - name: Hydrate validation-evidence branch
        if: steps.diff-gate.outputs.is_adoption_pr == 'true'
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/validation-evidence"
          git fetch origin validation-evidence || true
          if git show-ref --verify --quiet refs/remotes/origin/validation-evidence; then
            git archive --format=tar origin/validation-evidence | tar -x -C "$RUNNER_TEMP/validation-evidence"
          fi

      - name: Verify exact two-file adoption diff, immutable snapshot, and eligibility
        if: steps.diff-gate.outputs.is_adoption_pr == 'true'
        shell: bash
        env:
          INPUT_REQ_ID: ${{ github.event.inputs.request_id || '' }}
          INPUT_SLATE_ID: ${{ github.event.inputs.slate_id || '' }}
        run: |
          set -euo pipefail
          REQ_ID="$INPUT_REQ_ID"
          SLATE_ID="$INPUT_SLATE_ID"
          if [ -z "$REQ_ID" ] && [ -f config/model_selection.adoption.json ]; then
            REQ_ID=$(python3 -c "import json; print(json.load(open('config/model_selection.adoption.json'))['request_id'])")
            SLATE_ID=$(python3 -c "import json; print(json.load(open('config/model_selection.adoption.json'))['slate_id'])")
          fi
          git fetch origin main
          git show origin/main:config/model_selection.json > "$RUNNER_TEMP/base_model_selection.json"
          HEAD_SHA=$(git rev-parse HEAD)
          mapfile -t CHANGED < <(git diff --name-only origin/main...HEAD)
          ARGS=(
            verify-adoption-pr
            --evidence-root "$RUNNER_TEMP/validation-evidence"
            --request-id "$REQ_ID"
            --slate-id "$SLATE_ID"
            --base-selection-path "$RUNNER_TEMP/base_model_selection.json"
            --head-sha "$HEAD_SHA"
          )
          for f in "${CHANGED[@]}"; do
            ARGS+=(--changed-file "$f")
          done
          uv run python -m commands.manage_champion_adoption "${ARGS[@]}"
