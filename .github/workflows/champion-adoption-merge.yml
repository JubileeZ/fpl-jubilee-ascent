name: Champion adoption reserved merge

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: "Approved adoption request identifier"
        required: true
      slate_id:
        description: "Frozen comparison slate identifier"
        required: true
      approval_ref:
        description: "Protected GitHub Actions approval reference"
        required: true
      approved_pr_head_sha:
        description: "Exact approved PR head commit SHA"
        required: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: validation-evidence-reservation
  cancel-in-progress: false

jobs:
  execute-protected-merge:
    if: github.event_name == 'workflow_dispatch' || vars.CHAMPION_ADOPTION_LIVE_ENABLED == 'true'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out protected main
        uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"

      - name: Sync frozen dependencies
        run: uv sync --frozen

      - name: Hydrate validation-evidence branch
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/validation-evidence"
          git fetch origin validation-evidence || true
          if git show-ref --verify --quiet refs/remotes/origin/validation-evidence; then
            git archive --format=tar origin/validation-evidence | tar -x -C "$RUNNER_TEMP/validation-evidence"
          fi

      - name: Reconcile any prior interrupted merge and execute reserved adoption merge
        shell: bash
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          SLATE_ID: ${{ github.event.inputs.slate_id }}
          APPROVAL_REF: ${{ github.event.inputs.approval_ref }}
          APPROVED_PR_HEAD_SHA: ${{ github.event.inputs.approved_pr_head_sha }}
        run: |
          set -euo pipefail
          if [ -f "$RUNNER_TEMP/validation-evidence/reservation.json" ]; then
            uv run python -m commands.manage_champion_adoption reconcile-merge \
              --evidence-root "$RUNNER_TEMP/validation-evidence"
          fi
          git fetch origin "adoption/${REQUEST_ID}"
          PR_HEAD_SHA=$(git rev-parse "origin/adoption/${REQUEST_ID}")
          mapfile -t CHANGED < <(git diff --name-only origin/main..."origin/adoption/${REQUEST_ID}")
          ARGS=(
            execute-protected-merge
            --evidence-root "$RUNNER_TEMP/validation-evidence"
            --request-id "$REQUEST_ID"
            --slate-id "$SLATE_ID"
            --approval-ref "$APPROVAL_REF"
            --approved-pr-head-sha "$APPROVED_PR_HEAD_SHA"
            --pr-head-sha "$PR_HEAD_SHA"
            --checks-green
          )
          for f in "${CHANGED[@]}"; do
            ARGS+=(--changed-file "$f")
          done
          uv run python -m commands.manage_champion_adoption "${ARGS[@]}"

      - name: Persist updated evidence and push atomic adoption commit
        shell: bash
        env:
          REQUEST_ID: ${{ github.event.inputs.request_id }}
          APPROVAL_REF: ${{ github.event.inputs.approval_ref }}
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain config/model_selection.json config/model_selection.adoption.json)" ]; then
            git add config/model_selection.json config/model_selection.adoption.json
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "adopt(champion): merge ${REQUEST_ID} (${APPROVAL_REF})"
            git push origin HEAD:main
          fi
          WORK="$RUNNER_TEMP/evidence-branch"
          git worktree add "$WORK" origin/validation-evidence
          cp -R "$RUNNER_TEMP/validation-evidence/." "$WORK/"
          cd "$WORK"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git -c user.name="github-actions[bot]" \
                -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                commit -m "adoption: finalize merge ${REQUEST_ID}"
            git push origin HEAD:validation-evidence
          fi
